services:
  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cosmos-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CRASH_PROBABILITY: "0"
      FAILURE_PROBABILITY: "0"
      MAX_FAILURES: "5"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cosmos-network

  # Frontend
  frontend:
    build:
      context: ./cosmos-app
      dockerfile: Dockerfile
      target: development
    container_name: cosmos-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:5000/api
    volumes:
      - ./cosmos-app/src:/app/src
      - ./cosmos-app/public:/app/public
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - api
    networks:
      - cosmos-network

  # Production build (nginx)
  nginx:
    image: nginx:stable-alpine
    container_name: cosmos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - cosmos-network
    profiles:
      - production

networks:
  cosmos-network:
    driver: bridge
