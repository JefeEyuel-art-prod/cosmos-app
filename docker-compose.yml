services:
  db:
    image: postgres:16-alpine
    container_name: cosmos-db
    environment:
      POSTGRES_DB: cosmos
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cosmos-db:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmos-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cosmos-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cosmos
      CRASH_PROBABILITY: "0"
      FAILURE_PROBABILITY: "0"
      MAX_FAILURES: "5"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - cosmos-network

  frontend:
    build:
      context: ./cosmos-app
      dockerfile: Dockerfile
      target: development
    container_name: cosmos-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
    volumes:
      - ./cosmos-app/src:/app/src
      - ./cosmos-app/public:/app/public
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - cosmos-network

  nginx:
    image: nginx:stable-alpine
    container_name: cosmos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - cosmos-network
    profiles:
      - production

networks:
  cosmos-network:
    driver: bridge

volumes:
  cosmos-db:
